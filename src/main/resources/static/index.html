<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일기</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-author" id="author-name" onclick="onAuthorClick()">Guest</div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item" id="nav-home">홈</a>
      <div class="nav-group">
        <a href="#" class="nav-item" id="nav-diary">일기 글</a>
        <div class="year-list" id="year-list"></div>
      </div>
      <div class="nav-divider"></div>
      <div class="category-list" id="category-list"></div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-write" id="btn-write" onclick="openWriteModal()">+</button>
    </div>
  </aside>

  <main class="main" id="main-content">
    <div class="loading">불러오는 중...</div>
  </main>

  <!-- 로그인 모달 -->
  <div class="modal-overlay" id="login-modal" onclick="onOverlayClick(event, 'login-modal')">
    <div class="modal">
      <div class="modal-title">로그인하기</div>
      <input type="text" id="login-id" class="modal-input" placeholder="아이디" />
      <input type="password" id="login-pw" class="modal-input" placeholder="비밀번호"
             onkeydown="if(event.key==='Enter') handleLogin()" />
      <div class="modal-error" id="login-error"></div>
      <button class="modal-btn" onclick="handleLogin()">로그인</button>
    </div>
  </div>

  <!-- 일기 쓰기 모달 -->
  <div class="modal-overlay" id="write-modal" onclick="onOverlayClick(event, 'write-modal')">
    <div class="modal write-modal">
      <div class="modal-title">일기 쓰기</div>
      <input type="text" id="write-title" class="modal-input" placeholder="제목 – 비우면 날짜로 자동 입력" />
      <input type="date" id="write-date" class="modal-input" />
      <textarea id="write-content" class="modal-textarea" placeholder="내용을 마크다운으로 입력하세요"></textarea>
      <label class="modal-check">
        <input type="checkbox" id="write-public" checked /> 외부에 공개
      </label>
      <div class="modal-error" id="write-error"></div>
      <button class="modal-btn" onclick="handleWrite()">입력하기</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
